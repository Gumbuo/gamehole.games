name: Discord Deploy Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        run: |
          curl -s -X POST "https://discord.com/api/webhooks/1508547162466680932/9hwUDjI8odBYtEkkhLpTzNiajVREJshTwaMqipj5bYdsdH0cMqynMyguHcdzIKhA5Glu" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Gamehole.games Deployed\",
                \"description\": \"A new update has been pushed to [gamehole.games](https://gamehole.games)\",
                \"color\": 4498948,
                \"fields\": [
                  { \"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true },
                  { \"name\": \"Pushed by\", \"value\": \"\`${{ github.actor }}\`\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"\`${{ github.event.head_commit.message }}\`\" }
                ],
                \"footer\": { \"text\": \"gamehole.games\" }
              }]
            }"
